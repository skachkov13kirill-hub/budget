<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>РСч — Анализ расчётного счёта</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --card-hover: #22263a;
    --border: #2a2e3f;
    --text: #e4e6ef;
    --text-dim: #7a7f95;
    --accent: #6c5ce7;
    --accent-light: #a29bfe;
    --green: #00b894;
    --green-bg: rgba(0,184,148,0.08);
    --red: #fd7272;
    --red-bg: rgba(253,114,114,0.08);
    --yellow: #fdcb6e;
    --yellow-bg: rgba(253,203,110,0.08);
    --blue: #74b9ff;
    --blue-bg: rgba(116,185,255,0.08);
    --orange: #e17055;
  }
  
  body {
    font-family: 'Manrope', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  
  /* ===== HEADER ===== */
  .header {
    background: linear-gradient(135deg, #1a1d27 0%, #2d1b69 100%);
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .header h1 { font-size: 17px; font-weight: 800; letter-spacing: -0.5px; }
  
  .undo-btn {
    width: 40px; height: 40px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-dim);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    position: relative;
  }
  
  .undo-btn:hover { background: var(--card-hover); color: var(--text); }
  .undo-btn:disabled { opacity: 0.3; cursor: default; }
  .undo-btn .badge {
    position: absolute; top: -4px; right: -4px;
    background: var(--accent); color: white;
    font-size: 10px; font-weight: 800;
    width: 16px; height: 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  
  .header .period { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  
  .month-pills {
    display: flex; gap: 5px; overflow-x: auto; padding: 10px 0 2px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .month-pills::-webkit-scrollbar { display: none; }
  
  .month-pills button {
    white-space: nowrap; font-size: 12px; padding: 5px 10px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text);
    font-family: inherit; font-weight: 600; cursor: pointer;
    transition: all 0.15s;
  }
  .month-pills button:hover { background: var(--card-hover); }
  .month-pills button.active { background: var(--accent); border-color: var(--accent); }
  
  /* ===== BALANCE BAR ===== */
  .balance-bar {
    display: flex;
    gap: 1px;
    background: var(--border);
  }
  
  .balance-item {
    flex: 1;
    background: var(--card);
    padding: 10px 12px;
    text-align: center;
  }
  
  .balance-item .label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
  .balance-item .value { font-size: 16px; font-weight: 800; margin-top: 1px; font-variant-numeric: tabular-nums; }
  .balance-item .sub { font-size: 10px; color: var(--text-dim); }
  .green { color: var(--green); }
  .red { color: var(--red); }
  .blue { color: var(--blue); }
  .yellow { color: var(--yellow); }
  .orange { color: var(--orange); }
  
  /* ===== COMMISSION ALERT ===== */
  .commission-alert {
    background: var(--red-bg);
    border-left: 3px solid var(--red);
    padding: 10px 16px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .commission-alert .amount { font-weight: 800; color: var(--red); }
  
  /* ===== MAIN ===== */
  .main { padding: 12px 12px 80px; max-width: 1000px; margin: 0 auto; }
  
  /* ===== CATEGORY SECTION ===== */
  .cat-section { margin-bottom: 8px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  
  .cat-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px;
    background: var(--card); cursor: pointer; user-select: none;
    transition: background 0.15s;
  }
  .cat-head:hover { background: var(--card-hover); }
  
  .cat-head .left { display: flex; align-items: center; gap: 8px; }
  .cat-head .emoji { font-size: 18px; }
  .cat-head .name { font-weight: 700; font-size: 14px; }
  .cat-head .count { font-size: 11px; color: var(--text-dim); background: var(--bg); padding: 1px 7px; border-radius: 8px; font-weight: 600; }
  .cat-head .right { display: flex; align-items: center; gap: 8px; }
  .cat-head .total { font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
  .cat-head .arrow { color: var(--text-dim); transition: transform 0.2s; font-size: 12px; }
  .cat-head.open .arrow { transform: rotate(180deg); }
  
  .cat-body { display: none; background: var(--bg); }
  .cat-body.open { display: block; }
  
  /* ===== TRANSACTION ROW ===== */
  .tx {
    display: grid;
    grid-template-columns: 76px 1fr 95px 140px;
    align-items: center;
    padding: 8px 14px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    transition: background 0.1s;
  }
  .tx:hover { background: rgba(108,92,231,0.04); }
  
  .tx-date { color: var(--text-dim); font-weight: 500; font-variant-numeric: tabular-nums; font-size: 12px; }
  .tx-info { overflow: hidden; padding-right: 8px; }
  .tx-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .tx-desc { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-sum { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  
  .tx-cat select {
    width: 100%; padding: 5px 6px;
    border-radius: 6px; border: 1px solid var(--border);
    background: var(--card); color: var(--text);
    font-family: inherit; font-size: 11px; font-weight: 500;
    cursor: pointer;
  }
  .tx-cat select:focus { outline: none; border-color: var(--accent); }
  
  .dot-changed {
    display: inline-block; width: 5px; height: 5px;
    background: var(--yellow); border-radius: 50%;
    margin-left: 4px; vertical-align: middle;
  }
  
  /* ===== EKVAYRING GRID ===== */
  .ekv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; padding: 10px 12px; }
  .ekv-card {
    background: var(--card); border-radius: 8px; padding: 10px;
    border: 1px solid var(--border);
  }
  .ekv-card .mid { font-size: 10px; color: var(--text-dim); font-weight: 600; }
  .ekv-card .total { font-size: 16px; font-weight: 800; color: var(--green); margin: 2px 0; }
  .ekv-card .real { font-size: 11px; color: var(--text-dim); }
  .ekv-card .ops { font-size: 10px; color: var(--text-dim); }
  .ekv-card .branch-tag {
    margin-top: 4px; padding: 2px 6px;
    border-radius: 4px; font-size: 10px; font-weight: 700;
    background: var(--accent); color: white;
    display: inline-block; cursor: pointer;
  }
  .ekv-card .branch-tag.unset { background: var(--border); color: var(--text-dim); }
  
  /* ===== MERCHANT MAPPING MODAL ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center;
    z-index: 200;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card); border-radius: 14px;
    padding: 20px; max-width: 360px; width: 90%;
    border: 1px solid var(--border);
  }
  .modal h3 { font-size: 16px; margin-bottom: 12px; }
  .modal .branches { display: flex; flex-direction: column; gap: 6px; }
  .modal .branch-btn {
    padding: 10px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg);
    color: var(--text); font-family: inherit; font-size: 14px;
    font-weight: 600; cursor: pointer; text-align: left;
    transition: all 0.15s;
  }
  .modal .branch-btn:hover { background: var(--accent); border-color: var(--accent); }
  .modal .cancel-btn {
    margin-top: 10px; width: 100%; padding: 8px;
    border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--text-dim);
    font-family: inherit; font-size: 13px; cursor: pointer;
  }
  
  /* ===== TOAST ===== */
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--accent); color: white;
    padding: 10px 18px; border-radius: 10px;
    font-weight: 600; font-size: 13px;
    opacity: 0; transition: all 0.25s; z-index: 300;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  
  /* ===== RESPONSIVE ===== */
  @media (max-width: 600px) {
    .tx { grid-template-columns: 64px 1fr 80px; gap: 2px; padding: 8px 10px; }
    .tx-cat { grid-column: 1 / -1; margin-top: 4px; }
    .tx-cat select { max-width: 180px; }
    .ekv-grid { grid-template-columns: repeat(2, 1fr); }
    .balance-item .value { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <h1>📊 Расчётный счёт ИП</h1>
      <div class="period" id="periodText"></div>
    </div>
    <button class="undo-btn" id="undoBtn" onclick="undo()" disabled title="Отменить (Ctrl+Z)">
      ↩
    </button>
  </div>
  <div class="month-pills" id="monthPills"></div>
</div>

<div class="balance-bar" id="balanceBar"></div>
<div class="commission-alert" id="commissionAlert"></div>
<div class="main" id="main"></div>
<div class="toast" id="toast"></div>

<!-- Merchant mapping modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <h3 id="modalTitle">Привязать к филиалу</h3>
    <div class="branches" id="modalBranches"></div>
    <button class="cancel-btn" onclick="closeModal()">Отмена</button>
  </div>
</div>

<script>
let DATA = null;
let selectedMonth = 'all';
let undoStack = [];  // { type:'category', id, oldCat, newCat } or { type:'merchant', merchant, oldBranch, newBranch }

// Category & merchant changes
let catChanges = {};
let merchantMap = {};

// Load saved
try { catChanges = JSON.parse(localStorage.getItem('rsc_cats') || '{}'); } catch(e) {}
try { merchantMap = JSON.parse(localStorage.getItem('rsc_merchants') || '{}'); } catch(e) {}

const CATEGORIES = {
  'Переводы себе':          { emoji: '💸', order: 1 },
  'Аренда':                 { emoji: '🏠', order: 2 },
  'Подрядчики (химчистка)': { emoji: '🧹', order: 3 },
  'Подрядчики (ателье)':    { emoji: '🧵', order: 4 },
  'Погашение кредитов':     { emoji: '💳', order: 5 },
  'Реклама':                { emoji: '📢', order: 6 },
  'Оплата по счетам':       { emoji: '📄', order: 7 },
  'Налоги':                 { emoji: '📋', order: 8 },
  'Комиссии банка':         { emoji: '🏦', order: 9 },
  'Коммуналка':             { emoji: '🔧', order: 10 },
  'Расходники':             { emoji: '📦', order: 11 },
  'Амортизация':            { emoji: '🔨', order: 12 },
  'Прочее':                 { emoji: '❓', order: 99 },
};
const CAT_NAMES = Object.keys(CATEGORIES);

const BRANCHES = [
  'В 8', 'М 16', 'М 50', 'М 65', 'П 30', 'П 69', 'Д 21',
  'Химчистка 1', 'Химчистка 2', 'Не определён'
];

function getCat(tx) { return catChanges[tx.id] !== undefined ? catChanges[tx.id] : tx.category; }

function fmt(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1).replace('.0','') + 'М';
  if (n >= 10000) return Math.round(n/1000) + 'К';
  return n.toLocaleString('ru-RU', {maximumFractionDigits: 0});
}

function fmtFull(n) { return n.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbwYYk5LU9uTxaPhJkt8X89mXpTlfZaR8dSQcw3SNZtIws1nYRlxy_MAGErMPmO4dY_b1g/exec';

function save() {
  localStorage.setItem('rsc_cats', JSON.stringify(catChanges));
  localStorage.setItem('rsc_merchants', JSON.stringify(merchantMap));
}

// === САМООБУЧЕНИЕ: синхронизация с Google Sheets ===

async function syncToSheets(type, key, value) {
  // Сохраняем правило в облако для будущих парсингов
  try {
    const response = await fetch(SHEETS_URL + '?action=saveBusinessRule', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, key, value }),
      mode: 'no-cors'  // Apps Script требует
    });
    console.log(`✓ Правило сохранено: ${type} ${key} → ${value}`);
  } catch (e) {
    console.warn('Sync error (non-critical):', e);
  }
}

async function loadRulesFromSheets() {
  // Загружаем правила из облака при старте
  try {
    const script = document.createElement('script');
    script.src = SHEETS_URL + '?action=getBusinessRules&callback=applyCloudRules&t=' + Date.now();
    document.head.appendChild(script);
  } catch (e) {
    console.warn('Load rules error:', e);
  }
}

function applyCloudRules(data) {
  if (!data || data.error) return;
  
  let applied = 0;
  
  // Применить правила мерчантов (если нет локальных)
  if (data.merchants) {
    for (const [mid, branch] of Object.entries(data.merchants)) {
      if (!merchantMap[mid]) {
        merchantMap[mid] = branch;
        applied++;
      }
    }
  }
  
  // Применить правила категорий
  if (data.categories) {
    for (const [key, cat] of Object.entries(data.categories)) {
      // Найти транзакцию по контрагенту и применить категорию
      const tx = DATA.transactions.find(t => t.contragent === key || t.id == key);
      if (tx && catChanges[tx.id] === undefined) {
        catChanges[tx.id] = cat;
        applied++;
      }
    }
  }
  
  if (applied > 0) {
    save();
    render();
    toast(`☁️ Загружено ${applied} правил из облака`);
  }
}

// ===== UNDO =====
function pushUndo(action) {
  undoStack.push(action);
  if (undoStack.length > 50) undoStack.shift();
  updateUndoBtn();
}

function undo() {
  if (!undoStack.length) return;
  const action = undoStack.pop();
  if (action.type === 'category') {
    if (action.oldCat === null) delete catChanges[action.id];
    else catChanges[action.id] = action.oldCat;
    toast('↩ Отменено');
  } else if (action.type === 'merchant') {
    if (action.oldBranch === null) delete merchantMap[action.merchant];
    else merchantMap[action.merchant] = action.oldBranch;
    toast('↩ Отменено');
  }
  save();
  render();
}

function updateUndoBtn() {
  const btn = document.getElementById('undoBtn');
  btn.disabled = !undoStack.length;
  const existing = btn.querySelector('.badge');
  if (existing) existing.remove();
  if (undoStack.length) {
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = undoStack.length;
    btn.appendChild(badge);
  }
}

// Ctrl+Z support
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
});

// ===== CATEGORY CHANGE =====
function changeCat(id, newCat) {
  const tx = DATA.transactions.find(t => t.id === id);
  if (!tx) return;
  const oldCat = catChanges[id] !== undefined ? catChanges[id] : null;
  pushUndo({ type: 'category', id, oldCat, newCat: newCat });
  
  if (newCat === tx.category) delete catChanges[id];
  else catChanges[id] = newCat;
  
  save();
  
  // Самообучение: сохранить правило в облако по контрагенту
  if (tx.contragent && newCat !== tx.category) {
    syncToSheets('category', tx.contragent, newCat);
  }
  
  toast(`✓ → ${CATEGORIES[newCat]?.emoji || '❓'} ${newCat}`);
  render();
}

// ===== MERCHANT MAPPING =====
let currentMerchant = null;

function openMerchantModal(mid) {
  currentMerchant = mid;
  document.getElementById('modalTitle').textContent = `Мерчант №${mid}`;
  const container = document.getElementById('modalBranches');
  container.innerHTML = BRANCHES.map(b =>
    `<button class="branch-btn" onclick="setMerchantBranch('${b}')">${b}</button>`
  ).join('');
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('open');
  currentMerchant = null;
}

function setMerchantBranch(branch) {
  if (!currentMerchant) return;
  const old = merchantMap[currentMerchant] || null;
  pushUndo({ type: 'merchant', merchant: currentMerchant, oldBranch: old, newBranch: branch });
  merchantMap[currentMerchant] = branch;
  save();
  
  // Самообучение: сохранить привязку в облако
  syncToSheets('merchant', currentMerchant, branch);
  
  toast(`✓ №${currentMerchant} → ${branch}`);
  closeModal();
  render();
}

// ===== MONTH FILTER =====
function getMonths(txs) {
  const s = new Set();
  txs.forEach(t => { const [d,m,y] = t.date.split('.'); s.add(`${y}-${m}`); });
  return [...s].sort();
}

function filterMonth(txs) {
  if (selectedMonth === 'all') return txs;
  return txs.filter(t => { const [d,m,y] = t.date.split('.'); return `${y}-${m}` === selectedMonth; });
}

function setMonth(m) { selectedMonth = m; render(); }

// ===== TOGGLE SECTION =====
function toggle(el) {
  el.classList.toggle('open');
  el.nextElementSibling.classList.toggle('open');
}

// ===== RENDER =====
function render() {
  if (!DATA) return;
  
  document.getElementById('periodText').textContent =
    `Счёт ••5630 • ${DATA.period}`;
  
  updateUndoBtn();
  
  // Month pills
  const months = getMonths(DATA.transactions);
  const mnames = { '01':'Янв','02':'Фев','03':'Мар','04':'Апр','05':'Май','06':'Июн','07':'Июл','08':'Авг','09':'Сен','10':'Окт','11':'Ноя','12':'Дек' };
  document.getElementById('monthPills').innerHTML =
    `<button class="${selectedMonth==='all'?'active':''}" onclick="setMonth('all')">Все</button>` +
    months.map(m => {
      const [y, mo] = m.split('-');
      return `<button class="${selectedMonth===m?'active':''}" onclick="setMonth('${m}')">${mnames[mo]} ${y.slice(2)}</button>`;
    }).join('');
  
  // Balance bar
  const changes = Object.keys(catChanges).length + Object.keys(merchantMap).length;
  document.getElementById('balanceBar').innerHTML = `
    <div class="balance-item">
      <div class="label">Баланс на ${DATA.balance_end_date}</div>
      <div class="value blue">${fmt(DATA.balance_end)}₽</div>
    </div>
    <div class="balance-item">
      <div class="label">Поступления</div>
      <div class="value green">+${fmt(DATA.turnover_credit)}₽</div>
    </div>
    <div class="balance-item">
      <div class="label">Списания</div>
      <div class="value red">-${fmt(DATA.turnover_debit)}₽</div>
    </div>
    <div class="balance-item">
      <div class="label">Изменений</div>
      <div class="value" style="color:var(--accent)">${changes}</div>
    </div>
  `;
  
  // Commission alert
  document.getElementById('commissionAlert').innerHTML = `
    <div>⚠️ Комиссия Сбербанка 0.7% за период: удержано <span class="amount">${fmtFull(DATA.total_commission)}₽</span></div>
    <div style="font-size:11px;color:var(--text-dim)">Реальный оборот: ${fmt(DATA.total_real_turnover)}₽</div>
  `;
  
  const filtered = filterMonth(DATA.transactions);
  
  // Group by category
  const groups = {};
  filtered.forEach(t => {
    const cat = getCat(t);
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(t);
  });
  
  const sortedCats = Object.keys(groups).sort((a,b) => (CATEGORIES[a]?.order||99) - (CATEGORIES[b]?.order||99));
  
  let html = renderEkvayring();
  
  sortedCats.forEach(cat => {
    html += renderCatSection(cat, groups[cat]);
  });
  
  document.getElementById('main').innerHTML = html;
}

function renderEkvayring() {
  const ekv = DATA.ekvayring;
  const merchants = Object.entries(ekv).sort((a,b) => b[1].received - a[1].received);
  const totalRec = merchants.reduce((s,[_,d]) => s + d.received, 0);
  const totalReal = merchants.reduce((s,[_,d]) => s + d.real_turnover, 0);
  const totalComm = merchants.reduce((s,[_,d]) => s + d.commission, 0);
  const totalCount = merchants.reduce((s,[_,d]) => s + d.count, 0);
  
  const mapped = merchants.filter(([m]) => merchantMap[m]).length;
  
  const cards = merchants.map(([id, d]) => {
    const branch = merchantMap[id];
    const branchTag = branch
      ? `<span class="branch-tag" onclick="event.stopPropagation();openMerchantModal('${id}')">${branch}</span>`
      : `<span class="branch-tag unset" onclick="event.stopPropagation();openMerchantModal('${id}')">+ Филиал</span>`;
    return `
      <div class="ekv-card">
        <div class="mid">Мерчант №${id}</div>
        <div class="total">${fmt(d.received)}₽</div>
        <div class="real">Реальный: ${fmt(d.real_turnover)}₽ <span style="color:var(--red)">(-${fmt(d.commission)})</span></div>
        <div class="ops">${d.count} операций • ${d.active_days} дней</div>
        ${branchTag}
      </div>
    `;
  }).join('');
  
  return `
    <div class="cat-section">
      <div class="cat-head" onclick="toggle(this)">
        <div class="left">
          <span class="emoji">💰</span>
          <span class="name">Эквайринг</span>
          <span class="count">${totalCount} шт • ${mapped}/${merchants.length} привязано</span>
        </div>
        <div class="right">
          <span class="total green">+${fmt(totalRec)}₽</span>
          <span class="arrow">▼</span>
        </div>
      </div>
      <div class="cat-body">
        <div style="padding:8px 14px;font-size:12px;color:var(--text-dim)">
          Нажмите «+ Филиал» чтобы привязать мерчант к точке. Это нужно для сверки с отчётами портных.
        </div>
        <div class="ekv-grid">${cards}</div>
      </div>
    </div>
  `;
}

function renderCatSection(catName, txs) {
  const cat = CATEGORIES[catName] || { emoji: '❓', order: 99 };
  const total = txs.reduce((s,t) => s + t.amount, 0);
  
  const rows = txs.sort((a,b) => {
    const da = a.date.split('.').reverse().join('');
    const db = b.date.split('.').reverse().join('');
    return da.localeCompare(db);
  }).map(t => {
    const changed = catChanges[t.id] !== undefined;
    const opts = CAT_NAMES.map(c =>
      `<option value="${c}" ${c===catName?'selected':''}>${CATEGORIES[c]?.emoji||'❓'} ${c}</option>`
    ).join('');
    
    return `
      <div class="tx">
        <div class="tx-date">${t.date}</div>
        <div class="tx-info">
          <div class="tx-name">${esc(t.contragent || 'Не указан')}${changed?'<span class="dot-changed"></span>':''}</div>
          <div class="tx-desc" title="${esc(t.purpose)}">${esc(t.purpose)}</div>
        </div>
        <div class="tx-sum red">-${fmtFull(t.amount)}</div>
        <div class="tx-cat">
          <select onchange="changeCat(${t.id},this.value)">${opts}</select>
        </div>
      </div>
    `;
  }).join('');
  
  return `
    <div class="cat-section">
      <div class="cat-head" onclick="toggle(this)">
        <div class="left">
          <span class="emoji">${cat.emoji}</span>
          <span class="name">${catName}</span>
          <span class="count">${txs.length}</span>
        </div>
        <div class="right">
          <span class="total red">-${fmt(total)}₽</span>
          <span class="arrow">▼</span>
        </div>
      </div>
      <div class="cat-body">${rows}</div>
    </div>
  `;
}

// Close modal on escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});
</script>

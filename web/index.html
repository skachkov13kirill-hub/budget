<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/app.css?v=23">
<title>DressCode · Дашборд</title>
</head>
<body>

<!-- HEADER -->
<header class="app-header">
  <div>
    <div class="app-title">DressCode</div>
    <div class="app-subtitle" id="headerSubtitle">Загрузка...</div>
  </div>
  <div class="header-right">
    <div class="update-badge" id="updateBadge">&mdash;</div>
    <button class="btn-refresh" id="btnRefresh" onclick="refreshAll()" title="Обновить">&#x21bb;</button>
  </div>
</header>

<nav class="bottom-nav">
  <button class="nav-btn active" onclick="switchTab('business',this)" id="nav-business">
    <span class="nav-icon">&#x1F3E2;</span>Бизнес
  </button>
  <button class="nav-btn" onclick="switchTab('daily',this)" id="nav-daily">
    <span class="nav-icon">&#x1F4C5;</span>Дни
  </button>
  <button class="nav-btn" onclick="switchTab('payments',this)" id="nav-payments">
    <span class="nav-icon">&#x1F4B3;</span>Платежи
  </button>
  <button class="nav-btn" onclick="switchTab('tasks',this)" id="nav-tasks">
    <span class="nav-icon">&#x2705;</span>Задачи
  </button>
  <button class="nav-btn" onclick="switchTab('agents',this)" id="nav-agents">
    <span class="nav-icon">&#x1F916;</span>Агенты
  </button>
</nav>

<!-- TAB: БИЗНЕС -->
<div class="main-tab active" id="tab-business">
  <div class="biz-date-nav">
    <button class="biz-date-arrow" onclick="bizNavMonth(-1)">&larr;</button>
    <div class="biz-date-selectors">
      <select id="bizMonthSelect" onchange="loadBranches()">
        <option value="1">Январь</option><option value="2">Февраль</option>
        <option value="3">Март</option><option value="4">Апрель</option>
        <option value="5">Май</option><option value="6">Июнь</option>
        <option value="7">Июль</option><option value="8">Август</option>
        <option value="9">Сентябрь</option><option value="10">Октябрь</option>
        <option value="11">Ноябрь</option><option value="12">Декабрь</option>
      </select>
      <select id="bizYearSelect" onchange="loadBranches()">
        <option value="2025">2025</option>
        <option value="2026" selected>2026</option>
      </select>
    </div>
    <button class="biz-date-arrow" onclick="bizNavMonth(1)">&rarr;</button>
    <button class="biz-date-today" onclick="bizNavToday()">Сегодня</button>
  </div>
  <div class="biz-day-nav" id="bizDayNav">
    <span class="biz-day-label" id="bizDayLabel">Сегодня</span>
  </div>
  <div id="bizLoading"><div class="loading-box"><div class="spinner"></div><p>Загрузка филиалов...</p></div></div>
  <div id="bizError" style="display:none;"></div>
  <div id="bizOverviewContent" style="display:none;">
    <div class="card-gradient">
      <div style="text-align:center;font-size:16px;font-weight:700;margin-bottom:14px;">Сеть из 10 ателье</div>
      <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);">
        <div class="stat-box" style="cursor:pointer;" onclick="openNetworkDetail('atelie')"><div class="stat-label">Ателье &#x25B8;</div><div class="stat-value" id="ov-atelie">&mdash;</div><div class="stat-sub" id="ov-atelie-plan"></div></div>
        <div class="stat-box" style="cursor:pointer;" onclick="openNetworkDetail('avgcheck')"><div class="stat-label">Ср. чек &#x25B8;</div><div class="stat-value" id="ov-himch">&mdash;</div><div class="stat-sub" id="ov-himch-plan"></div></div>
        <div class="stat-box" style="cursor:pointer;" onclick="openNetworkDetail('total')"><div class="stat-label">&#x1F4B0; На счетах &#x25B8;</div><div class="stat-value" id="ov-total">&mdash;</div><div class="stat-sub" id="ov-total-plan"></div></div>
        <div class="stat-box" style="cursor:pointer;" onclick="openNetworkDetail('clients')"><div class="stat-label">Клиенты &#x25B8;</div><div class="stat-value" id="ov-clients">&mdash;</div><div class="stat-sub" id="ov-avg-check"></div></div>
        <div class="stat-box" style="cursor:pointer;" onclick="openNetworkDetail('himchistka')"><div class="stat-label">&#x1F9F9; Химчистка &#x25B8;</div><div class="stat-value" id="ov-himch-fact">&mdash;</div><div class="stat-sub" id="ov-himch-sub"></div></div>
        <div class="stat-box" style="background:rgba(255,255,255,0.28);border:1px solid rgba(255,255,255,0.5);cursor:pointer;" onclick="openNetworkDetail('forecast')">
          <div class="stat-label">&#x1F52E; Прогноз &#x25B8;</div>
          <div class="stat-value" id="ov-forecast">&mdash;</div>
          <div class="stat-sub" id="ov-forecast-sub">тренд</div>
          <div id="ov-weather" class="weather-badge" style="display:none;"></div>
        </div>
      </div>
      <div class="progress-wrap"><div class="progress-fill" id="ov-progress" style="width:0%">0%</div></div>
    </div>
  </div>
  <div id="dailyPulseCard" style="display:none;"></div>
  <div id="plannerCard" style="display:none;"></div>
  <div id="filialsGrid"></div>
</div>

<!-- TAB: ЕЖЕДНЕВНО -->
<div class="main-tab" id="tab-daily">
  <div id="dailyChartLoading" style="text-align:center;padding:40px;color:#999;">Загрузка...</div>
  <div id="dailyChartContent" style="display:none;">
    <div id="dailyChartBars"></div>
    <div id="dailyDetailOverlay" style="display:none;"></div>
  </div>
  <div id="dailyChartError" style="display:none;"></div>
</div>

<!-- TAB: ПЛАТЕЖИ -->
<div class="main-tab" id="tab-payments">
  <div class="payments-header">
    <span>&#x1F4B3; Платежи &mdash; <span id="paymentsMonthName">март</span></span>
  </div>
  <div class="payments-summary" id="paymentsSummary"></div>
  <div id="paymentsContent">
    <div class="loading-box"><div class="spinner"></div></div>
  </div>
</div>

<!-- TAB: АГЕНТЫ -->
<div class="main-tab" id="tab-agents">
  <div class="payments-header">
    <span>&#x1F916; Агенты</span>
  </div>
  <div id="agentsContent">
    <div class="loading-box"><div class="spinner"></div></div>
  </div>
</div>

<!-- TAB: ЗАДАЧИ -->
<div class="main-tab" id="tab-tasks">
  <div class="tasks-header">
    <div class="tasks-view-toggle">
      <button class="tasks-view-btn active" id="btnViewCal" onclick="tasksSetView('calendar')">Календарь</button>
      <button class="tasks-view-btn" id="btnViewTree" onclick="tasksSetView('tree')">Доска</button>
      <button class="tasks-view-btn" id="btnViewBranch" onclick="tasksSetView('branch')">Ателье</button>
    </div>
    <div class="tasks-week-nav">
      <button class="tasks-week-arrow" onclick="tasksChangeWeek(-1)">&larr;</button>
      <span class="tasks-week-label" id="tasksWeekLabel"></span>
      <button class="tasks-week-arrow" onclick="tasksChangeWeek(1)">&rarr;</button>
    </div>
  </div>
  <div class="tasks-stats" id="tasksStats"></div>

  <!-- CALENDAR VIEW -->
  <div class="tasks-panel active" id="tasksPanelCal">
    <div class="tasks-day-tabs" id="tasksDayTabs"></div>
    <div class="tasks-day-content" id="tasksDayContent"></div>
    <button class="tasks-add-slot-btn" onclick="tasksOpenAddSlot()">+ Добавить задачу</button>
  </div>

  <!-- TREE VIEW -->
  <div class="tasks-panel" id="tasksPanelTree">
    <div id="tasksTreeView"></div>
    <button class="tasks-add-root-btn" onclick="tasksOpenAddNode(null)">+ Новый блок</button>
  </div>

  <!-- BRANCH NOTEPAD VIEW -->
  <div class="tasks-panel" id="tasksPanelBranch">
    <div id="tasksBranchView"></div>
  </div>
</div>

<!-- TASK MODALS -->
<div class="tasks-modal-bg" id="tasksAddSlotModal" onclick="if(event.target===this)tasksCloseModal('tasksAddSlotModal')">
  <div class="tasks-modal">
    <div class="tasks-modal-title">Добавить задачу</div>
    <label class="tasks-modal-label">Название</label>
    <input type="text" class="tasks-modal-input" id="tasksSlotName" placeholder="Что нужно сделать..." />
    <label class="tasks-modal-label">Категория</label>
    <select class="tasks-modal-input" id="tasksSlotCategory">
      <option value="">— без категории —</option>
      <option value="КБ">КБ</option>
      <option value="Мои дела">Мои дела</option>
      <option value="Семья">Семья</option>
      <option value="Планирование">Планирование</option>
    </select>
    <label class="tasks-modal-label">Время</label>
    <div style="display:flex;gap:8px;">
      <input type="time" class="tasks-modal-input" id="tasksSlotStart" value="10:00" />
      <input type="time" class="tasks-modal-input" id="tasksSlotEnd" value="11:00" />
    </div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button class="tasks-modal-cancel" onclick="tasksCloseModal('tasksAddSlotModal')">Отмена</button>
      <button class="tasks-modal-save" onclick="tasksSaveSlot()">Добавить</button>
    </div>
  </div>
</div>

<div class="tasks-modal-bg" id="tasksAddNodeModal" onclick="if(event.target===this)tasksCloseModal('tasksAddNodeModal')">
  <div class="tasks-modal">
    <div class="tasks-modal-title" id="tasksAddNodeTitle">Добавить</div>
    <label class="tasks-modal-label">Название</label>
    <input type="text" class="tasks-modal-input" id="tasksNodeName" placeholder="Введите название..." />
    <label class="tasks-modal-label">Цвет</label>
    <div class="tasks-color-picker" id="tasksColorPicker"></div>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button class="tasks-modal-cancel" onclick="tasksCloseModal('tasksAddNodeModal')">Отмена</button>
      <button class="tasks-modal-save" onclick="tasksSaveNode()">Добавить</button>
    </div>
  </div>
</div>

<!-- BRANCH TASK MODAL -->
<div class="tasks-modal-bg" id="tasksBranchAddModal" onclick="if(event.target===this)tasksCloseModal('tasksBranchAddModal')">
  <div class="tasks-modal">
    <div class="tasks-modal-title" id="tasksBranchAddTitle">Добавить задачу</div>
    <input type="text" class="tasks-modal-input" id="tasksBranchTaskText" placeholder="Что нужно сделать..." />
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button class="tasks-modal-cancel" onclick="tasksCloseModal('tasksBranchAddModal')">Отмена</button>
      <button class="tasks-modal-save" onclick="tasksBranchSaveTask()">Добавить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js?v=23"></script>
<script src="js/weather.js?v=23"></script>
<script src="js/payments.js?v=23"></script>
<script src="js/agents.js?v=23"></script>
<script src="js/tasks.js?v=23"></script>
<script src="js/business.js?v=23"></script>
<script src="js/daily.js?v=23"></script>
</body>
</html>

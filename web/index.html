<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/app.css?v=31">
<title>DressCode · Дашборд</title>
<script>
// Nuclear cache cleanup: kill ALL service workers and ALL caches, then reload
(function(){
  var CLEAN_KEY='dc_cleaned_v33';
  if(localStorage.getItem(CLEAN_KEY)) return;
  var needsClean=false;
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(regs){
      if(regs.length>0){needsClean=true;regs.forEach(function(r){r.unregister();});}
    });
  }
  if('caches' in window){
    caches.keys().then(function(names){
      if(names.length>0){needsClean=true;names.forEach(function(n){caches.delete(n);});}
      if(needsClean){
        localStorage.setItem(CLEAN_KEY,'1');
        setTimeout(function(){location.reload(true);},600);
      }
    });
  }
})();
</script>
</head>
<body>

<!-- HEADER -->
<header class="app-header">
  <div>
    <div class="app-title">DressCode</div>
    <div class="app-subtitle" id="headerSubtitle">Загрузка...</div>
  </div>
  <div class="header-right">
    <div class="update-badge" id="updateBadge">&mdash;</div>
    <button class="btn-refresh" id="btnRefresh" onclick="refreshAll()" title="Обновить">&#x21bb;</button>
  </div>
</header>

<nav class="bottom-nav">
  <button class="nav-btn active" onclick="switchTab('business',this)" id="nav-business">
    <span class="nav-icon">&#x1F3E2;</span>Бизнес
  </button>
  <button class="nav-btn" onclick="switchTab('daily',this)" id="nav-daily">
    <span class="nav-icon">&#x1F4C5;</span>Дни
  </button>
  <button class="nav-btn" onclick="switchTab('payments',this);if(typeof loadPayments==='function')loadPayments();" id="nav-payments">
    <span class="nav-icon">&#x1F4B3;</span>Оплаты
  </button>
  <button class="nav-btn" onclick="switchTab('nedviga',this);if(typeof loadNedviga==='function')loadNedviga();" id="nav-nedviga">
    <span class="nav-icon">&#x1F3E0;</span>Недвига
  </button>
</nav>

<!-- TAB: БИЗНЕС -->
<div class="main-tab active" id="tab-business">
  <div class="biz-date-nav">
    <button class="biz-date-arrow" onclick="bizNavMonth(-1)">&larr;</button>
    <div class="biz-date-selectors">
      <select id="bizMonthSelect" onchange="loadBranches()">
        <option value="1">Январь</option><option value="2">Февраль</option>
        <option value="3">Март</option><option value="4">Апрель</option>
        <option value="5">Май</option><option value="6">Июнь</option>
        <option value="7">Июль</option><option value="8">Август</option>
        <option value="9">Сентябрь</option><option value="10">Октябрь</option>
        <option value="11">Ноябрь</option><option value="12">Декабрь</option>
      </select>
      <select id="bizYearSelect" onchange="loadBranches()">
        <option value="2025">2025</option>
        <option value="2026" selected>2026</option>
      </select>
    </div>
    <button class="biz-date-arrow" onclick="bizNavMonth(1)">&rarr;</button>
    <button class="biz-date-today" onclick="bizNavToday()">Сегодня</button>
  </div>
  <div class="biz-day-nav" id="bizDayNav">
    <button class="biz-day-arrow" onclick="bizSnapDay(-1)">&larr;</button>
    <span class="biz-day-label" id="bizDayLabel" onclick="bizSnapToday()">Сегодня</span>
    <button class="biz-day-arrow" id="bizDayRight" onclick="bizSnapDay(1)">&rarr;</button>
  </div>
  <div id="todayReportCard" style="display:none;"></div>
  <div id="bizLoading"><div class="loading-box"><div class="spinner"></div><p>Загрузка филиалов...</p></div></div>
  <div id="bizError" style="display:none;"></div>
  <div id="bizOverviewContent" style="display:none;">
    <div class="card-gradient">
      <div style="text-align:center;font-size:16px;font-weight:700;margin-bottom:14px;">Сеть из 10 ателье</div>
      <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);">
        <div class="stat-box" style="cursor:pointer;" onclick="openNetworkDetail('total')"><div class="stat-label">Оборот &#x25B8;</div><div class="stat-value" id="ov-oborot">&mdash;</div><div class="stat-sub" id="ov-oborot-plan"></div></div>
        <div class="stat-box" style="cursor:pointer;" onclick="openNetworkDetail('atelie')"><div class="stat-label">Ателье &#x25B8;</div><div class="stat-value" id="ov-atelie">&mdash;</div><div class="stat-sub" id="ov-atelie-plan"></div></div>
        <div class="stat-box" style="cursor:pointer;" onclick="openNetworkDetail('forecast')"><div class="stat-label">&#x2696;&#xFE0F; Дельта &#x25B8;</div><div class="stat-value" id="ov-himch-fact">&mdash;</div><div class="stat-sub" id="ov-himch-sub"></div></div>
        <div class="stat-box" style="cursor:pointer;" onclick="openNetworkDetail('vs2025')"><div class="stat-label">&#x1F19A; vs 2025 &#x25B8;</div><div class="stat-value" id="ov-clients-check">&mdash;</div><div class="stat-sub" id="ov-clients-check-sub"></div></div>
        <div class="stat-box" style="cursor:pointer;" onclick="openAnomalies()"><div class="stat-label">&#x26A0;&#xFE0F; Контроль &#x25B8;</div><div class="stat-value" id="ov-anomalies">&mdash;</div><div class="stat-sub" id="ov-anomalies-sub"></div></div>
        <div class="stat-box" style="background:rgba(255,255,255,0.28);border:1px solid rgba(255,255,255,0.5);cursor:pointer;" onclick="openNetworkDetail('forecast')">
          <div class="stat-label">&#x1F52E; Прогноз &#x25B8;</div>
          <div class="stat-value" id="ov-forecast">&mdash;</div>
          <div class="stat-sub" id="ov-forecast-sub">тренд</div>
          <div id="ov-weather" class="weather-badge" style="display:none;"></div>
        </div>
      </div>
      <div class="progress-wrap"><div class="progress-fill" id="ov-progress" style="width:0%">0%</div></div>
    </div>
  </div>
  <div id="filialsGrid"></div>
  <div id="dailyPulseCard" style="display:none;"></div>
  <div id="plannerCard" style="display:none;"></div>
</div>

<!-- TAB: ЕЖЕДНЕВНО -->
<div class="main-tab" id="tab-daily">
  <div id="dailyChartLoading" style="text-align:center;padding:40px;color:#999;">Загрузка...</div>
  <div id="dailyChartContent" style="display:none;">
    <div id="dailyChartBars"></div>
    <div id="dailyDetailOverlay" style="display:none;"></div>
  </div>
  <div id="dailyChartError" style="display:none;"></div>
</div>

<!-- TAB: ОПЛАТЫ (FIX-031) -->
<div class="main-tab" id="tab-payments">
  <div id="paymentsContent">
    <div class="loading-box"><div class="spinner"></div><p>Загрузка оплат...</p></div>
  </div>
</div>

<!-- TAB: НЕДВИГА -->
<div class="main-tab" id="tab-nedviga">
  <div id="nedvigaContent">
    <div class="loading-box"><div class="spinner"></div><p>Загрузка портфеля...</p></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js?v=34"></script>
<script src="js/weather.js?v=29"></script>
<script src="js/business.js?v=31"></script>
<script src="js/daily.js?v=29"></script>
<script src="js/nedviga.js?v=3"></script>
<script src="js/payments.js?v=3"></script>
</body>
</html>
